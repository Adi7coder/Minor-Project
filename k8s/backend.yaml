apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cleanblr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: adi7coder/cleanblr-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: cleanblr-config
        - secretRef:
            name: cleanblr-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cleanblr
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
